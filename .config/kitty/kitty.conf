# ── Font ──────────────────────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
font_size        12

# ── Window ────────────────────────────────────────────────────────────────────
window_padding_width      12
confirm_os_window_close   0
enable_audio_bell         no

# ── Transparency ──────────────────────────────────────────────────────────────
# Fully opaque. 0.96 still let wallpaper bleed through on bright wallpapers
# via Hyprland's blur (per-pixel alpha gets blurred+composited even though
# the window-level opacity rule is pinned to 1.0). 1.0 = zero alpha, blur
# has nothing translucent left to composite.
background_opacity        1.0

# ── Colors (Catppuccin Mocha — fixed, NOT derived from the wallpaper) ────────
background              #1e1e2e
foreground              #cdd6f4

cursor                  #f5e0dc
cursor_text_color       #1e1e2e

selection_background    #585b70
selection_foreground    #cdd6f4

url_color               #89b4fa

active_border_color     #b4befe
inactive_border_color   #6c7086
bell_border_color       #f9e2af

active_tab_background   #cba6f7
active_tab_foreground   #11111b
inactive_tab_background #181825
inactive_tab_foreground #cdd6f4

