# hypridle — idle behaviour
#
# Policy: on battery the screen dims then sleeps; on AC nothing happens at all.
# There is no idle auto-lock in either case — lock manually with SUPER+L.
#
# Note on syntax: Hyprland 0.56 replaced hyprctl's string dispatchers with Lua,
# so `hyprctl dispatch dpms on` is a parse error now. It has to be the Lua form
# `hyprctl dispatch 'hl.dsp.dpms("on")'`.

general {
    lock_cmd            = pidof hyprlock || hyprlock
    unlock_cmd          = killall -q hyprlock
    before_sleep_cmd    = loginctl lock-session
    after_sleep_cmd     = hyprctl dispatch 'hl.dsp.dpms("on")'
    ignore_dbus_inhibit = false
}

# 4 min on battery: dim the backlight to 10% (brightnessctl -s saves the level
# so on-resume can put it back exactly where it was).
listener {
    timeout    = 240
    on-timeout = sh -c '[ "$(cat /sys/class/power_supply/ADP0/online)" = "0" ] && brightnessctl -s set 10%'
    on-resume  = brightnessctl -r
}

# 6 min on battery: panel off. Any key or mouse move brings it back
# (misc.key_press_enables_dpms / mouse_move_enables_dpms are on).
listener {
    timeout    = 360
    on-timeout = sh -c '[ "$(cat /sys/class/power_supply/ADP0/online)" = "0" ] && hyprctl dispatch '"'"'hl.dsp.dpms("off")'"'"''
    on-resume  = hyprctl dispatch 'hl.dsp.dpms("on")'
}
