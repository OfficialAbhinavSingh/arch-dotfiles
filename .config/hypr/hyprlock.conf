# /* ---- 💫 Hyprlock Aesthetic Configuration 💫 ---- */

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
}

# --- BACKGROUND ---
background {
    monitor =
    # Use the current wallpaper. hyprlock will use this if it's a valid path.
    path = /home/laterabhi/Pictures/wallpapers/anime/anime_cafe_tokyonight.png
    # color = rgba(25, 20, 20, 1.0)
    blur_passes = 2
    blur_size = 4
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# --- TOP BAR ---

# Session Box
shape {
    monitor =
    size = 230, 45
    color = rgba(0, 0, 0, 0.4)
    rounding = 15
    border_size = 2
    border_color = rgba(203, 166, 247, 0.5)
    position = 30, -30
    halign = left
    valign = top
}

label {
    monitor =
    text = <span foreground="##cba6f7">Session </span> Hyprland (uwsm)
    color = rgba(255, 255, 255, 1.0)
    font_size = 11
    font_family = JetBrains Mono Nerd Font
    position = 45, -45
    halign = left
    valign = top
}

# Layout Box
shape {
    monitor =
    size = 120, 45
    color = rgba(0, 0, 0, 0.4)
    rounding = 15
    border_size = 2
    border_color = rgba(203, 166, 247, 0.5)
    position = 280, -30
    halign = left
    valign = top
}

label {
    monitor =
    text = <span foreground="##cba6f7">Layout </span> 󰌌 us
    color = rgba(255, 255, 255, 1.0)
    font_size = 11
    font_family = JetBrains Mono Nerd Font
    position = 295, -45
    halign = left
    valign = top
}

# Status Box (Right)
shape {
    monitor =
    size = 450, 45
    color = rgba(0, 0, 0, 0.4)
    rounding = 15
    border_size = 2
    border_color = rgba(203, 166, 247, 0.5)
    position = -80, -30
    halign = right
    valign = top
}

label {
    monitor =
    text = cmd[update:2000] echo "󰻠 $(grep 'cpu ' /proc/stat | awk '{usage=($2+$4)*100/($2+$4+$5)} END {printf \"%0.1f%%\", usage}')  󰍛 $(free -m | awk '/Mem:/ { printf \"%0.1f%%\", $3/$2*100 }')  󰕾 $(pamixer --get-volume 2>/dev/null || echo 0)%  󰤨 $(nmcli -t -f active,ssid dev wifi | grep '^yes' | cut -d: -f2 | head -n 1)"
    color = rgba(255, 255, 255, 1.0)
    font_size = 11
    font_family = JetBrains Mono Nerd Font
    position = -105, -45
    halign = right
    valign = top
}

# Power Icon (Top Right)
label {
    monitor =
    text = 󰐥
    color = rgba(243, 139, 168, 0.8)
    font_size = 20
    font_family = JetBrains Mono Nerd Font
    position = -30, -41
    halign = right
    valign = top
}

# --- MAIN SECTION (LEFT) ---

# Greeting
label {
    monitor =
    text = cmd[update:60000] echo "$(date +%H | awk '{if ($1 < 12) print \"おはよう、\"; else if ($1 < 18) print \"こんにちは、\"; else print \"こんばんは、\"}')"
    color = rgba(255, 255, 255, 1.0)
    font_size = 28
    font_family = JetBrains Mono Nerd Font
    position = 100, 160
    halign = left
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(255, 255, 255, 1.0)
    font_size = 130
    font_family = JetBrains Mono Nerd Font ExtraBold
    position = 100, 20
    halign = left
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:43200000] echo "$(date +"%A, %d %B %Y")"
    color = rgba(255, 255, 255, 0.8)
    font_size = 26
    font_family = JetBrains Mono Nerd Font
    position = 100, -100
    halign = left
    valign = center
}

# Quote
label {
    monitor =
    text = Focus on the <span foreground="##f5c2e7">progress</span>, not the perfection.
    color = rgba(255, 255, 255, 0.6)
    font_size = 16
    font_family = JetBrains Mono Nerd Font Italic
    position = 100, -170
    halign = left
    valign = center
}

# --- USER SECTION (RIGHT) ---

# Profile Image (Avatar)
image {
    monitor =
    # Placeholder path. If you have an image, replace this path.
    path = /home/laterabhi/Pictures/avatar.png
    size = 180
    rounding = 30
    border_size = 3
    border_color = rgba(203, 166, 247, 0.5)
    rotate = 0
    reload_time = -1
    position = -150, 130
    halign = right
    valign = center
}

# Username
label {
    monitor =
    text = LATERABHI
    color = rgba(255, 255, 255, 1.0)
    font_size = 24
    font_family = JetBrains Mono Nerd Font Bold
    position = -150, -10
    halign = right
    valign = center
}

# Input Field
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.25
    dots_center = true
    rounding = 30
    outer_color = rgba(203, 166, 247, 0.5)
    inner_color = rgba(0, 0, 0, 0.5)
    font_color = rgb(255, 255, 255)
    fade_on_empty = false
    placeholder_text = <span foreground="##bac2de">Password...</span>
    hide_input = false
    position = -150, -110
    halign = right
    valign = center
}

# --- BOTTOM SECTION ---

# Night Mode Indicator
shape {
    monitor =
    size = 170, 50
    color = rgba(0, 0, 0, 0.4)
    rounding = 25
    border_size = 2
    border_color = rgba(203, 166, 247, 0.5)
    position = 50, 50
    halign = left
    valign = bottom
}

label {
    monitor =
    text = 󰤄 Night Mode
    color = rgba(255, 255, 255, 1.0)
    font_size = 12
    font_family = JetBrains Mono Nerd Font
    position = 75, 68
    halign = left
    valign = bottom
}

# Power Controls (Bottom Right)
label {
    monitor =
    text = 󰤄 Sleep    󰜉 Restart    󰐥 Shut Down
    color = rgba(255, 255, 255, 0.7)
    font_size = 12
    font_family = JetBrains Mono Nerd Font
    position = -50, 50
    halign = right
    valign = bottom
}
