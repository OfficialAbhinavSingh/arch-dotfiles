# /* ---- Hyprlock — Catppuccin Mocha Centered ---- */
# Mirrors the SDDM catppuccin-mocha-mauve login screen layout.
# All elements centered — no split layout, no transparent shape bleed-through.

general {
    disable_loading_bar = true
    hide_cursor          = true
    grace                = 0
    no_fade_in           = false
    no_fade_out          = false
    ignore_empty_input   = false
}

# ─── BACKGROUND ──────────────────────────────────────────────────────────────

background {
    monitor     =
    path        = /home/laterabhi/Pictures/wallpapers/anime/japan-purple-blur.png
    blur_passes = 2
    blur_size   = 5
    noise       = 0.0100
    contrast    = 0.8500
    brightness  = 0.6800
    vibrancy    = 0.2000
    vibrancy_darkness = 0.0500
}

# ─── CLOCK (top-center) ──────────────────────────────────────────────────────

# Japanese time-based greeting
label {
    monitor     =
    text        = cmd[update:60000] echo "$(date +%H | awk '{if ($1 < 5) print \"おやすみ、\"; else if ($1 < 12) print \"おはよう、\"; else if ($1 < 18) print \"こんにちは、\"; else print \"こんばんは、\"}')"
    color       = rgba(180,190,254,0.88)
    font_size   = 18
    font_family = JetBrains Mono Nerd Font
    shadow_passes = 2
    shadow_size   = 3
    shadow_color  = rgba(0,0,0,0.55)
    position    = 0, 310
    halign      = center
    valign      = center
}

# Large time
label {
    monitor     =
    text        = cmd[update:1000] echo "$(date +"%H:%M")"
    color       = rgba(205,214,244,1.0)
    font_size   = 95
    font_family = JetBrains Mono Nerd Font ExtraBold
    shadow_passes = 3
    shadow_size   = 8
    shadow_color  = rgba(0,0,0,0.65)
    position    = 0, 215
    halign      = center
    valign      = center
}

# Date
label {
    monitor     =
    text        = cmd[update:43200000] echo "$(date +"%A, %d %B %Y")"
    color       = rgba(166,173,200,0.80)
    font_size   = 20
    font_family = JetBrains Mono Nerd Font
    shadow_passes = 2
    shadow_size   = 2
    shadow_color  = rgba(0,0,0,0.45)
    position    = 0, 112
    halign      = center
    valign      = center
}

# ─── AUTH CARD (center) ──────────────────────────────────────────────────────
# Card spans screen y=460 to y=840 on 1080p (center at y=650).
# All inner elements verified to be within those bounds.

# Card background — opaque fill, NO transparency that bleeds through blur
shape {
    monitor      =
    size         = 340, 380
    color        = rgba(24,24,37,0.82)
    rounding     = 24
    border_size  = 1
    border_color = rgba(203,166,247,0.28)
    position     = 0, -110
    halign       = center
    valign       = center
}

# Avatar
image {
    monitor      =
    path         = /home/laterabhi/Pictures/avatar.png
    size         = 82
    rounding     = -1
    border_size  = 2
    border_color = rgba(203,166,247,0.75)
    rotate       = 0
    reload_time  = -1
    position     = 0, 20
    halign       = center
    valign       = center
}

# Username
label {
    monitor     =
    text        = laterabhi
    color       = rgba(205,214,244,1.0)
    font_size   = 18
    font_family = JetBrains Mono Nerd Font Bold
    shadow_passes = 2
    shadow_size   = 2
    shadow_color  = rgba(0,0,0,0.55)
    position    = 0, -60
    halign      = center
    valign      = center
}

# Subtitle
label {
    monitor     =
    text        = <span foreground="##cba6f7"> </span><span foreground="##6c7086">arch linux · hyprland</span>
    color       = rgba(108,112,134,0.80)
    font_size   = 12
    font_family = JetBrains Mono Nerd Font
    position    = 0, -90
    halign      = center
    valign      = center
}

# Lock icon
label {
    monitor     =
    text        = 󰌾
    color       = rgba(203,166,247,0.55)
    font_size   = 16
    font_family = JetBrains Mono Nerd Font
    position    = 0, -128
    halign      = center
    valign      = center
}

# Password input
input-field {
    monitor           =
    size              = 280, 50
    outline_thickness = 2
    dots_size         = 0.22
    dots_spacing      = 0.28
    dots_center       = true
    dots_rounding     = -1
    rounding          = 25
    outer_color       = rgba(203,166,247,0.55)
    inner_color       = rgba(49,50,68,0.90)
    font_color        = rgba(205,214,244,1.0)
    fade_on_empty     = false
    fade_timeout      = 1000
    placeholder_text  = <span foreground="##6c7086">  Password...</span>
    hide_input        = false
    check_color       = rgba(166,227,161,0.85)
    fail_color        = rgba(243,139,168,0.85)
    fail_text         = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition   = 300
    capslock_color    = rgba(249,226,175,0.85)
    position          = 0, -188
    halign            = center
    valign            = center
}

# Unlock hint
label {
    monitor     =
    text        = <span foreground="##6c7086">Press </span><span foreground="##cba6f7">↵</span><span foreground="##6c7086"> to unlock</span>
    color       = rgba(108,112,134,0.70)
    font_size   = 11
    font_family = JetBrains Mono Nerd Font
    position    = 0, -250
    halign      = center
    valign      = center
}

# ─── BOTTOM BAR ──────────────────────────────────────────────────────────────

label {
    monitor     =
    text        = cmd[update:60000] echo "󰥔 $(uptime -p | sed 's/up //')"
    color       = rgba(108,112,134,0.60)
    font_size   = 11
    font_family = JetBrains Mono Nerd Font
    position    = 40, 28
    halign      = left
    valign      = bottom
}

label {
    monitor     =
    text        =   Sleep  ·  󰜉 Restart  ·  󰐥 Shutdown
    color       = rgba(108,112,134,0.60)
    font_size   = 11
    font_family = JetBrains Mono Nerd Font
    position    = -40, 28
    halign      = right
    valign      = bottom
}
