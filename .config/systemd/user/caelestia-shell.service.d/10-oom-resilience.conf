# Why this drop-in exists
# -----------------------
# 2026-09-11: the shell died six times in 25s and wedged on start-limit-hit.
# It was NOT a Qt/quickshell fault - `quickshell --private-check-compat` passed.
# earlyoom shot it:
#
#   sending SIGKILL to process 3432803 uid 1000 "qs":
#     oom_score 800, oom_score_adj 200, VmRSS 34 MiB
#
# Two separate defects are visible in that one line.
#
# 1. oom_score_adj 200. systemd stamps *every* user service with +200 (user@.service
#    sits at 100, its children get 200). A 34 MiB desktop shell therefore outranked
#    401 joblib/loky workers at 160 MiB each sitting at adj 0, because earlyoom sorts
#    by oom_score and adj dominates that number. The kill order was exactly inverted.
#    200 -> 100 is the whole available range here: lowering oom_score_adj below the
#    user manager's own 100 needs CAP_SYS_RESOURCE, which a user unit does not have.
#    The rest of the protection lives in earlyoom's --ignore list (system-level).
#
# 2. RestartSec=2 with StartLimitBurst=5 burns all five restarts in ten seconds.
#    Memory pressure lasts minutes, not seconds, so the unit always exhausted its
#    budget while the machine was still full and then stayed dead after it recovered.
#    Exponential backoff (2s, 4s, ... capped at 60s) spans the pressure window instead.

[Unit]
StartLimitIntervalSec=600
StartLimitBurst=20

[Service]
OOMScoreAdjust=100
RestartSec=2
RestartSteps=5
RestartMaxDelaySec=60
