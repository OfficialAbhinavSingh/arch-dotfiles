# The resurrect save script exits 1 when no tmux server is running, which made
# every clean stop mark the unit failed. `-` tells systemd to ignore the exit
# code of that step.
[Service]
ExecStop=
ExecStop=-/home/laterabhi/.config/tmux/plugins/tmux-resurrect/scripts/save.sh
ExecStop=-/usr/bin/tmux kill-server
