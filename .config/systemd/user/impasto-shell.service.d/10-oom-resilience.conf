# Same fix as caelestia-shell.service.d/10-oom-resilience.conf, and the same
# reason: systemd stamps every user service's children at oom_score_adj 200,
# which can outrank much heavier processes sitting at adj 0 when earlyoom
# sorts by oom_score. A desktop shell should not be first in line.
#
# RestartSteps gives exponential backoff (2s, 4s, ... capped at 60s) instead
# of burning StartLimitBurst in a few seconds of sustained memory pressure.

[Unit]
StartLimitIntervalSec=600
StartLimitBurst=20

[Service]
OOMScoreAdjust=100
RestartSec=2
RestartSteps=5
RestartMaxDelaySec=60
